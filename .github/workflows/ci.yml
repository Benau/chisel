name: cctools

on:
  workflow_dispatch:

env:
  TVOS_SDK: '26.3'
  TVSIM_SDK: '26.3'
  IPHONEOS_SDK: '26.3'
  IPHONESIM_SDK: '26.3'
  MACOS_SDK: '26.3'

jobs:
  package:
    name: Package cctools SDK
    runs-on: macos-15

    steps:
      - name: Show Xcode
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Copy SDK files
        run: |
          set -eux

          mkdir -p cctools/sdk

          XCODE="/Applications/Xcode_26.3.app"
          XCODE="${XCODE%/Contents/Developer}"

          echo "Using Xcode: $XCODE"

          cp -R \
            "$XCODE/Contents/Developer/Platforms/AppleTVOS.platform/Developer/SDKs/AppleTVOS.sdk" \
            cctools/sdk/AppleTVOS.sdk

          cp -R \
            "$XCODE/Contents/Developer/Platforms/AppleTVSimulator.platform/Developer/SDKs/AppleTVSimulator.sdk" \
            cctools/sdk/AppleTVSimulator.sdk

          cp -R \
            "$XCODE/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS.sdk" \
            cctools/sdk/iPhoneOS.sdk

          cp -R \
            "$XCODE/Contents/Developer/Platforms/iPhoneSimulator.platform/Developer/SDKs/iPhoneSimulator.sdk" \
            cctools/sdk/iPhoneSimulator.sdk

          cp -R \
            "$XCODE/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk" \
            cctools/sdk/MacOSX.sdk

          cp -R \
            "$XCODE/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/lib/clang/"*/lib/darwin \
            cctools/

          cd cctools/sdk

          mv AppleTVOS.sdk "AppleTVOS${TVOS_SDK}.sdk"
          ln -s "AppleTVOS${TVOS_SDK}.sdk" AppleTVOS.sdk

          mv AppleTVSimulator.sdk "AppleTVSimulator${TVSIM_SDK}.sdk"
          ln -s "AppleTVSimulator${TVSIM_SDK}.sdk" AppleTVSimulator.sdk

          mv iPhoneOS.sdk "iPhoneOS${IPHONEOS_SDK}.sdk"
          ln -s "iPhoneOS${IPHONEOS_SDK}.sdk" iPhoneOS.sdk

          mv iPhoneSimulator.sdk "iPhoneSimulator${IPHONESIM_SDK}.sdk"
          ln -s "iPhoneSimulator${IPHONESIM_SDK}.sdk" iPhoneSimulator.sdk

          mv MacOSX.sdk "MacOSX${MACOS_SDK}.sdk"
          ln -s "MacOSX${MACOS_SDK}.sdk" MacOSX.sdk

          cd ../..

          tar cf cctools.tar cctools

      - name: Upload cctools.tar
        uses: actions/upload-artifact@v4
        with:
          name: cctools
          path: cctools.tar

      - name: Upload to dummy release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: cctools.tar
          tag: cctools
          name: cctools
          body: "SDK archive generated from the macOS-15 GitHub Actions runner."
          allowUpdates: true
          replacesArtifacts: true
          prerelease: true

